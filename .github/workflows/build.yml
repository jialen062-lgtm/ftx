name: Build Forge 1.20.1 Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip mod source if needed
        run: |
          if [ -f "jujutsu-kaisen-forge-1.20.1-complete.zip" ]; then
            unzip -o -q jujutsu-kaisen-forge-1.20.1-complete.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build Mod JAR
        run: |
          BUILD_FILE=$(find . -maxdepth 4 -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "错误：仍找不到 build.gradle"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "找到项目目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload Built JAR
        uses: actions/upload-artifact@v4
        with:
          name: jjkmod-1.20.1-jar
          path: "**/build/libs/*.jar"
